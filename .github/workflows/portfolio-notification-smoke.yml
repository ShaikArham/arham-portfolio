name: Portfolio notification smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/portfolio-notification-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Health endpoint
        run: |
          curl --fail --show-error --retry 3 --retry-delay 10 https://arham-portfolio-notifications.onrender.com/health
      - name: Send one consolidated test event
        run: |
          curl --fail --show-error --retry 2 --retry-delay 5 -X POST 'https://arham-portfolio-notifications.onrender.com/event' -H 'Origin: https://shaikarham.github.io' -H 'Content-Type: application/json' --data '{"event":"session_summary","session":"abcdeffedcba","section":"contact","duration_seconds":43,"browser_info":{"user_agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36","mobile":false},"events":[{"type":"project_interaction","detail":"FireOps Lab","section":"projects","seconds":12},{"type":"cv_view","detail":"View CV clicked","section":"contact","seconds":36}]}'
